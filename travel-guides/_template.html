<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer"><!-- Wikimedia refuses hotlinked CSS backgrounds that carry a Referer -->
<title>{{TITLE}} — Travel Guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧭%3C/text%3E%3C/svg%3E">
<script>
(function(){
  try{ var t = localStorage.getItem('docs-theme'); if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f6f7f9; --card:#ffffff; --border:#e3e6ea;
    --fg:#1a1d23; --fg-muted:#5b6270;
    --accent:#2f6feb; --accent-soft:#eaf1ff;
    --code-bg:#1e2230; --code-fg:#e7eaf2; --code-muted:#8b93a7;
    --good:#1a7f4b; --good-bg:#e8f7ee; --good-border:#b6e3c6;
    --bad:#c0392b; --bad-bg:#fdecea; --bad-border:#f3c2bb;
    --warn:#9a6700; --warn-bg:#fff6e5; --warn-border:#f0dca3;
    --info:#2f6feb; --info-bg:#eaf1ff; --info-border:#c6dafc;
    --fun:#0f8a8a; --fun-bg:#e6f7f7; --fun-border:#bfe8e8;
    --interview:#7c3aed; --interview-bg:#f5f0ff; --interview-border:#ddd0fa;
    --notes:#7c3aed; --notes-bg:#f5f0ff; --notes-border:#ddd0fa;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161b; --bg-soft:#1b1e25; --card:#1b1e25; --border:#2b2f3a;
      --fg:#e7eaf2; --fg-muted:#9aa2b4;
      --accent:#6d9bff; --accent-soft:#1c2740;
      --code-bg:#0e1016; --code-fg:#e7eaf2; --code-muted:#7c8494;
      --good:#5fd08d; --good-bg:#12261c; --good-border:#255c3c;
      --bad:#ff8a7a; --bad-bg:#301716; --bad-border:#6b2a25;
      --warn:#f0c25a; --warn-bg:#2c2411; --warn-border:#5c4a1c;
      --info:#7fb0ff; --info-bg:#131f33; --info-border:#28416b;
      --fun:#5fd6d6; --fun-bg:#0f2626; --fun-border:#1f4d4d;
      --interview:#c4a6ff; --interview-bg:#241a35; --interview-border:#4b3570;
      --notes:#c4a6ff; --notes-bg:#241a35; --notes-border:#4b3570;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161b; --bg-soft:#1b1e25; --card:#1b1e25; --border:#2b2f3a;
    --fg:#e7eaf2; --fg-muted:#9aa2b4;
    --accent:#6d9bff; --accent-soft:#1c2740;
    --code-bg:#0e1016; --code-fg:#e7eaf2; --code-muted:#7c8494;
    --good:#5fd08d; --good-bg:#12261c; --good-border:#255c3c;
    --bad:#ff8a7a; --bad-bg:#301716; --bad-border:#6b2a25;
    --warn:#f0c25a; --warn-bg:#2c2411; --warn-border:#5c4a1c;
    --info:#7fb0ff; --info-bg:#131f33; --info-border:#28416b;
    --fun:#5fd6d6; --fun-bg:#0f2626; --fun-border:#1f4d4d;
    --interview:#c4a6ff; --interview-bg:#241a35; --interview-border:#4b3570;
    --notes:#c4a6ff; --notes-bg:#241a35; --notes-border:#4b3570;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; font-size:16px;
  }
  code, pre, .mono{font-family:"SF Mono",ui-monospace,"Fira Code",Consolas,"Cascadia Code",monospace;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .top-inner{
    max-width:1180px; margin:0 auto; padding:14px 24px;
    display:flex; flex-direction:column; gap:10px;
  }
  .brand{font-weight:700; font-size:15px; white-space:nowrap;}
  .brand span{color:var(--accent);}

  .toptabs{display:flex; flex-direction:column; gap:8px;}
  .toptabs input.tab-radio{display:none;}
  .tab-bar{display:flex; gap:8px; flex-wrap:wrap;}
  .tab-btn{
    cursor:pointer; user-select:none; padding:6px 14px; border-radius:999px;
    font-size:12.5px; font-weight:700; letter-spacing:.01em; color:var(--fg-muted);
    border:1px solid var(--border); background:var(--bg-soft);
    transition:background .15s, color .15s, border-color .15s;
  }
  .tab-btn:hover{background:var(--card);}
  #tab-project:checked ~ .tab-bar label[for="tab-project"],
  #tab-interview:checked ~ .tab-bar label[for="tab-interview"]{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  .tab-links{display:none; gap:6px; flex-wrap:wrap;}
  #tab-project:checked ~ .tab-links.proj{display:flex;}
  #tab-interview:checked ~ .tab-links.interview{display:flex;}
  .tab-links a{
    text-decoration:none; color:var(--fg-muted); font-size:13.5px;
    padding:7px 12px; border-radius:999px; border:1px solid transparent;
  }
  .tab-links a:hover{background:var(--bg-soft); color:var(--fg);}
  .tab-links a.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); font-weight:600;}

  .hero{max-width:1180px; margin:0 auto; padding:46px 24px 18px;}
  .hero .kicker{
    color:var(--interview); font-weight:700; font-size:13px; letter-spacing:.06em;
    text-transform:uppercase;
  }
  .hero h1{font-size:34px; margin:8px 0 10px; letter-spacing:-.02em;}
  .hero p.lead{color:var(--fg-muted); font-size:17px; max-width:780px; margin:0;}
  .hero .pills{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .hero .pill{
    font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:999px;
    background:var(--interview-bg); color:var(--interview); border:1px solid var(--interview-border);
  }

  .layout{
    max-width:1440px; margin:0 auto; padding:20px 24px 100px;
    display:flex; align-items:flex-start; gap:24px;
  }
  .nav-sidebar, aside.toc{flex-shrink:0;}
  .nav-sidebar{width:180px;}
  aside.toc{width:230px;}
  .content-center{flex:1; min-width:0; display:flex; justify-content:center;}
  .content-center > article{width:100%; max-width:760px;}
  @media (max-width:900px){ .layout{flex-direction:column;}
    .nav-sidebar, aside.toc{width:100%; position:static;}
    .content-center{display:block;} }

  .nav-sidebar{
    position:sticky; top:74px; max-height:calc(100vh - 100px); overflow:auto;
    border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-soft);
    padding:14px; display:flex; flex-direction:column; gap:4px;
  }
  .nav-sidebar input.tab-radio{display:none;}
  .nav-tabbar{display:flex; flex-direction:column; gap:6px; margin-bottom:6px;}
  .nav-tabbtn{
    cursor:pointer; user-select:none; text-align:left; padding:8px 12px; border-radius:9px;
    font-size:12.5px; font-weight:700; letter-spacing:.01em; color:var(--fg-muted);
    border:1px solid var(--border); background:var(--card);
    transition:background .15s, color .15s, border-color .15s;
  }
  .nav-tabbtn:hover{background:var(--bg);}
  #tab-about:checked ~ .nav-tabbar label[for="tab-about"],
  #tab-europe:checked ~ .nav-tabbar label[for="tab-europe"],
  #tab-world:checked ~ .nav-tabbar label[for="tab-world"]{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  .nav-links{display:none; flex-direction:column; gap:2px;}
  #tab-about:checked ~ .nav-links.about{display:flex;}
  #tab-europe:checked ~ .nav-links.europe{display:flex;}
  #tab-world:checked ~ .nav-links.world{display:flex;}
  .nav-links a{
    text-decoration:none; color:var(--fg-muted); font-size:13px;
    padding:6px 10px; border-radius:7px; line-height:1.3;
  }
  .nav-links a:hover{background:var(--card); color:var(--fg);}
  .nav-links a.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}

  aside.toc{
    position:sticky; top:74px; max-height:calc(100vh - 100px); overflow:auto;
    border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-soft);
    padding:16px;
  }
  aside.toc .toc-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-muted); font-weight:700; margin-bottom:10px;}
  aside.toc ol{list-style:none; margin:0; padding:0;}
  aside.toc li{margin:0 0 4px;}
  aside.toc a{
    display:block; text-decoration:none; color:var(--fg-muted); font-size:13.5px;
    padding:6px 8px; border-radius:8px; line-height:1.35;
  }
  aside.toc a:hover{background:var(--card); color:var(--fg);}
  aside.toc .toc-group{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; margin:14px 0 4px; padding:0 8px;}
  aside.toc .toc-group:first-child{margin-top:0;}
  aside.toc .toc-nav{list-style:none; margin:0 0 4px; padding:0;}
  aside.toc .toc-nav li{margin:0 0 2px;}
  aside.toc .toc-nav a{display:block; text-decoration:none; color:var(--fg-muted); font-size:13px; padding:5px 8px; border-radius:7px; line-height:1.3;}
  aside.toc .toc-nav a:hover{background:var(--card); color:var(--fg);}
  aside.toc .toc-nav a.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  aside.toc .toc-divider{height:1px; background:var(--border); margin:16px 0;}

  article section{margin-bottom:52px; scroll-margin-top:80px;}
  article h2{
    font-size:23px; margin:0 0 6px; display:flex; align-items:baseline; gap:10px;
    letter-spacing:-.01em;
  }
  article h2 .num{color:var(--accent); font-variant-numeric:tabular-nums; font-size:16px;}
  article h3{font-size:17px; margin:26px 0 8px;}
  article p{color:var(--fg); margin:10px 0;}
  article p.muted{color:var(--fg-muted);}
  article ul, article ol{padding-left:22px;}
  article li{margin:6px 0;}
  .section-desc{color:var(--fg-muted); margin-top:2px; margin-bottom:18px;}

  .card{
    border:1px solid var(--border); border-radius:var(--radius); background:var(--card);
    padding:18px 20px; margin:16px 0;
  }

  .codecard{
    border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin:16px 0;
    background:var(--code-bg);
  }
  .codecard .bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 14px; background:color-mix(in srgb, var(--code-bg) 80%, black 6%);
    border-bottom:1px solid color-mix(in srgb, var(--code-fg) 12%, transparent);
  }
  .codecard .bar .path{color:var(--code-muted); font-size:12.5px;}
  .codecard pre{margin:0; padding:16px; overflow:auto;}
  .codecard code{color:var(--code-fg); font-size:13px; white-space:pre;}
  .codecard code .tok-kw{color:#cc7832;}
  .codecard code .tok-str{color:#6a8759;}
  .codecard code .tok-num{color:#6897bb;}
  .codecard code .tok-com{color:#7f7f7f; font-style:italic;}
  .codecard code .tok-deco{color:#bbb529;}
  .codecard code .tok-def{color:#ffc66d;}
  .codecard code .tok-self{color:#c792ea;}
  .cmt{color:#7c8494;}
  .out{color:#f0c25a;}

  .callout{
    border-radius:var(--radius); border:1px solid; padding:14px 16px; margin:16px 0;
    display:flex; gap:12px; align-items:flex-start; font-size:14.5px;
  }
  .callout .ic{font-size:17px; line-height:1.4;}
  .callout.good{background:var(--good-bg); border-color:var(--good-border); color:var(--good);}
  .callout.bad{background:var(--bad-bg); border-color:var(--bad-border); color:var(--bad);}
  .callout.warn{background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn);}
  .callout.info{background:var(--info-bg); border-color:var(--info-border); color:var(--info);}
  .callout.fun{background:var(--fun-bg); border-color:var(--fun-border); color:var(--fun);}
  .callout.interview{background:var(--interview-bg); border-color:var(--interview-border); color:var(--interview);}
  .callout .body{color:var(--fg);}
  .callout .body b{color:inherit;}
  .callout .body .tag{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    margin-bottom:4px;
  }

  table{width:100%; border-collapse:collapse; margin:16px 0; font-size:14px;}
  th, td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  th{color:var(--fg-muted); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em;}
  tr:last-child td{border-bottom:none;}

  .badge{
    display:inline-block; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .badge.good{background:var(--good-bg); color:var(--good); border:1px solid var(--good-border);}
  .badge.bad{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-border);}

  .fe-analogy{
    border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 var(--radius) var(--radius) 0;
    padding:12px 16px; margin:16px 0; font-size:14.5px;
  }
  .fe-analogy .tag{font-weight:700; color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}

  /* Q&A accordion */
  .qa{border:1px solid var(--border); border-radius:12px; margin:10px 0; overflow:hidden; background:var(--card);}
  .qa summary{
    cursor:pointer; padding:14px 46px 14px 16px; font-weight:600; list-style:none;
    position:relative; font-size:14.8px;
  }
  .qa summary::-webkit-details-marker{display:none;}
  .qa summary::after{
    content:"+"; color:var(--fg-muted); font-size:19px; position:absolute; right:16px; top:50%;
    transform:translateY(-56%); font-weight:400;
  }
  .qa[open] summary::after{content:"–";}
  .qa summary:hover{background:var(--bg-soft);}
  .qa .a{padding:0 16px 16px; color:var(--fg-muted); font-size:14.3px; border-top:1px solid var(--border); padding-top:12px;}
  .qa .a b{color:var(--fg);}
  .qa .a code{color:var(--fg);}
  .qa .difficulty{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    margin-right:8px; vertical-align:middle;
  }
  .qa .difficulty.trick{background:var(--interview-bg); color:var(--interview); border:1px solid var(--interview-border);}
  .qa .difficulty.core{background:var(--info-bg); color:var(--info); border:1px solid var(--info-border);}

  .cheat{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin:16px 0;}
  .cheat table{margin:0;}
  .cheat th{background:var(--bg-soft);}

  /* Nesting (matryoshka) diagram */
  .nest{border:2px solid var(--border); border-radius:16px; padding:30px 20px 20px; position:relative; margin:0;}
  .nest .tag{
    position:absolute; top:-11px; left:16px; background:var(--bg); padding:0 8px;
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  }
  .nest p{margin:0; color:var(--fg-muted); font-size:13.8px;}
  .nest.level1{border-color:var(--accent); margin:20px 0;}
  .nest.level1 > .tag{color:var(--accent);}
  .nest.level2{border-color:var(--fun); margin-top:16px;}
  .nest.level2 > .tag{color:var(--fun);}
  .nest.level3{border-color:var(--interview); margin-top:16px; background:var(--bg-soft);}
  .nest.level3 > .tag{color:var(--interview);}

  /* Flashcards for term memorization */
  .flashgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin:16px 0;}
  .flashcard{border:1px solid var(--border); border-radius:12px; padding:16px 18px; background:var(--card);}
  .flashcard .fc-num{
    display:inline-block; width:22px; height:22px; border-radius:50%; background:var(--interview-bg);
    color:var(--interview); font-size:12px; font-weight:700; text-align:center; line-height:22px; margin-bottom:8px;
  }
  .flashcard .term{font-weight:700; font-size:15.5px; margin-bottom:6px;}
  .flashcard .def{font-size:13.6px; color:var(--fg); margin-bottom:10px;}
  .flashcard .mnemo{font-size:13px; color:var(--fg-muted); font-style:italic; border-top:1px dashed var(--border); padding-top:9px;}
  .flashcard .mnemo b{color:var(--fun); font-style:normal;}

  .rule-box{
    border:1px dashed var(--interview-border); background:var(--interview-bg); border-radius:var(--radius);
    padding:16px 18px; margin:18px 0; font-size:14.8px;
  }
  .rule-box b{color:var(--interview);}

  figure.diagram{
    margin:20px 0; padding:20px 20px 16px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-soft);
  }
  figure.diagram svg{display:block; width:100%; height:auto; max-width:720px; margin:0 auto; color:var(--fg);}
  figure.diagram svg text{font-family:inherit;}
  figure.diagram figcaption{
    margin-top:12px; font-size:13px; color:var(--fg-muted); text-align:center; line-height:1.5;
  }

  footer.page{
    max-width:1180px; margin:0 auto; padding:20px 24px 60px; color:var(--fg-muted); font-size:13.5px;
    border-top:1px solid var(--border); margin-top:20px; padding-top:24px;
  }
  footer.page a{color:var(--accent); text-decoration:none;}

  /* --- node-doc extras --- */
  .tree{
    background:var(--code-bg); color:var(--code-fg); border-radius:var(--radius); padding:18px 20px;
    font-size:13px; overflow:auto; border:1px solid var(--border);
    white-space:pre; line-height:1.5;
  }
  .tree .d{color:#7fb0ff;} .tree .c{color:#7c8494;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:700px){.grid2{grid-template-columns:1fr;}}

  .flow{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:18px 0;}
  .flow .step{
    border:1px solid var(--border); background:var(--bg-soft); border-radius:10px;
    padding:10px 14px; font-size:13.5px; font-weight:600;
  }
  .flow .arrow{color:var(--fg-muted); font-size:16px;}
  article a{color:var(--accent); text-underline-offset:2px;}
  article a:hover{text-decoration-thickness:2px;}

  .tag{
    flex-shrink:0; display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px;
    border-radius:999px; white-space:nowrap;
  }
  .tag.recurring{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-border);}
  .tag.gap{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-border);}
  .tag.rising{background:var(--fun-bg); color:var(--fun); border:1px solid var(--fun-border);}
  .tag.strength{background:var(--good-bg); color:var(--good); border:1px solid var(--good-border);}
  .tag.notes{background:var(--notes-bg); color:var(--notes); border:1px solid var(--notes-border);}
  .task{margin:22px 0;}
  .task .task-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .task .tasknum{color:var(--accent); font-weight:700; font-size:13px; flex-shrink:0;}
  .task .taskdiff{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    flex-shrink:0;
  }
  .task .taskdiff.easy{background:var(--good-bg); color:var(--good); border:1px solid var(--good-border);}
  .task .taskdiff.mid{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-border);}
  .task .taskdiff.hard{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-border);}
  .task .tasktitle{font-weight:600; font-size:14.5px;}
  details.answer{
    border:1px solid var(--border); border-radius:10px; margin-top:2px; background:var(--bg-soft);
    overflow:hidden;
  }
  details.answer summary{
    cursor:pointer; padding:10px 14px; font-weight:600; font-size:13.5px; color:var(--accent);
    list-style:none; user-select:none;
  }
  details.answer summary::-webkit-details-marker{display:none;}
  details.answer summary::before{content:"▸ Показати відповідь"; }
  details.answer[open] summary::before{content:"▾ Відповідь"; }
  details.answer .a-body{
    padding:0 14px 14px; border-top:1px solid var(--border); padding-top:12px;
    font-size:14px; color:var(--fg);
  }
  details.answer .a-body p{margin:8px 0;}
  details.answer .a-body .out{
    font-family:"SF Mono",ui-monospace,"Fira Code",Consolas,"Cascadia Code",monospace;
    background:var(--code-bg); color:var(--code-fg); padding:8px 12px; border-radius:8px;
    display:block; margin:8px 0; white-space:pre; font-size:13px;
  }
  .topic-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .topic-head h2{font-size:21px; margin:0; letter-spacing:-.01em;}
  .decision{
    border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius);
    background:var(--bg-soft); padding:16px 18px; margin:20px 0;
  }
  .decision-title{font-weight:700; font-size:15px; margin-bottom:4px;}
  .decision table{margin:10px 0; background:var(--card); border-radius:8px;}
  .decision p{margin:10px 0; font-size:15px;}
  tr.chosen td{background:var(--good-bg);}
  tr.chosen td:first-child{color:var(--good);}
  .remember{
    border:1px dashed var(--warn-border); background:var(--warn-bg); color:var(--fg);
    border-radius:var(--radius); padding:12px 16px; margin:18px 0 0; font-size:15px;
  }
  .remember b{color:var(--warn);}
  .callout .body a{color:inherit; font-weight:600; text-decoration:underline;}
  article table{display:block; overflow-x:auto;}
  @media (min-width:700px){ article table{display:table;} }

  /* --- python-doc extras --- */
  aside.toc .toc-count{
    float:right; font-size:11px; color:var(--fg-muted); background:var(--card);
    border-radius:999px; padding:1px 6px; border:1px solid var(--border);
  }
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0;}
  @media (max-width:700px){.stat-row{grid-template-columns:1fr;}}
  .stat{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; background:var(--bg-soft);}
  .stat .k{font-size:12px; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.04em;}
  .stat .v{font-size:20px; font-weight:700; margin-top:4px;}
  .part-divider{display:flex; align-items:center; gap:14px; margin:64px 0 40px;}

  .part-divider .line{flex:1; height:1px; background:var(--border);}
  .part-divider .label{

  .qa .difficulty.adv{background:var(--fun-bg); color:var(--fun); border:1px solid var(--fun-border);}

  .lvl.l2{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-border);}
  .lvl.l3{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-border);}
  .lvl.type{background:var(--interview-bg); color:var(--interview); border:1px solid var(--interview-border);}
  .timeline{border-left:2px solid var(--accent); margin:20px 0 20px 8px; padding-left:20px;}
  .timeline .ev{position:relative; margin:0 0 18px;}
  .timeline .ev::before{content:""; position:absolute; left:-27px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg);}
  .timeline .yr{font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; font-size:14px;}
  .timeline .ev-t{font-weight:700;}
  .timeline .ev p{margin:4px 0 0; font-size:14.3px; color:var(--fg-muted);}
  .math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif; font-size:1.05em; white-space:nowrap;}
  .math-block{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif; font-size:18px; text-align:center; padding:14px; margin:14px 0; border:1px dashed var(--border); border-radius:var(--radius); background:var(--bg-soft); overflow-x:auto;}


  /* --- system-design extras --- */
  .say{color:var(--fg-muted); font-size:.9em; font-weight:400; font-style:normal;}
  .steps{counter-reset:st; list-style:none; padding-left:0;}
  .steps > li{counter-increment:st; position:relative; padding-left:38px; margin:12px 0;}
  .steps > li::before{content:counter(st); position:absolute; left:0; top:0; width:26px; height:26px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; text-align:center; line-height:26px;}
  .vs{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0;}
  @media (max-width:700px){.vs{grid-template-columns:1fr;}}
  .vs > div{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; background:var(--card);}
  .vs h4{margin:0 0 6px; font-size:15px;}
  .vs ul{margin:6px 0 0; padding-left:18px; font-size:14.3px;}
  /* --- ai-doc extras --- */
  .kbd, kbd{
    display:inline-block; font-family:"SF Mono",ui-monospace,Consolas,monospace; font-size:12px; line-height:1.2;
    padding:2px 6px; border-radius:6px; border:1px solid var(--border); border-bottom-width:2px;
    background:var(--bg-soft); color:var(--fg); white-space:nowrap;
  }
  .filetree-note{font-size:13px; color:var(--fg-muted); margin-top:-8px;}
  .dirgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin:16px 0;}
  .dir{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; background:var(--card);}
  .dir .dir-h{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; margin-bottom:4px;}
  .dir p{margin:4px 0 0; font-size:14px; color:var(--fg-muted);}
  .dir .lvl{margin-left:auto;}
  .checklist{list-style:none; padding-left:0;}
  .checklist li{position:relative; padding-left:28px;}
  .checklist li::before{content:"☐"; position:absolute; left:4px; top:0; color:var(--accent); font-weight:700;}
  .metric-before-after{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin:14px 0;}
  .metric-before-after .m{border:1px solid var(--border); border-radius:10px; padding:10px 14px; background:var(--bg-soft); text-align:center;}
  .metric-before-after .m b{display:block; font-size:20px;}
  .metric-before-after .m.after b{color:var(--good);}
  .metric-before-after .m.before b{color:var(--bad);}

<script>
(function(){
  var root = document.documentElement, btn = document.getElementById('theme-toggle');
  if(!btn) return;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function current(){
    var t = root.getAttribute('data-theme');
    return t === 'light' || t === 'dark' ? t : (mq && mq.matches ? 'dark' : 'light');
  }
  function render(){
    var dark = current() === 'dark';
    btn.textContent = dark ? '☀️ Світла тема' : '🌙 Темна тема';
    btn.setAttribute('aria-label', dark ? 'Увімкнути світлу тему' : 'Увімкнути темну тему');
  }
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('docs-theme', next); }catch(e){}
    render();
  });
  if(mq && mq.addEventListener) mq.addEventListener('change', render);
  render();
})();
</script>
